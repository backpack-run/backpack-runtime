name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: gofmt -w cmd internal
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/backpack

name: Extended release qualification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable release tag to qualify
        required: true
        default: v0.3.0-alpha.2
      coding_model:
        description: Execution-qualified candidate model for the Codex job
        required: true
        default: qwen3-coder-30b-a3b
      run_macos:
        type: boolean
        default: false
      run_codex:
        type: boolean
        default: false
      run_ssh:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-arm64-core:
    if: ${{ inputs.run_macos }}
    runs-on: [self-hosted, macOS, ARM64, backpack-qualification]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ inputs.release_tag }}'}
      - name: Install immutable release and qualify managed GGUF
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BACKPACK_HOME: ${{ runner.temp }}/backpack-qualification
        run: |
          set -euo pipefail
          sh scripts/install.sh "$RELEASE_TAG"
          export PATH="$HOME/.local/bin:$PATH"
          backpack --version
          backpack doctor --json
          backpack models --json
          backpack pull smollm2-135m
          backpack serve --address 127.0.0.1:11435 >"$RUNNER_TEMP/backpack-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11435/api/backpack/v1/health >/dev/null && break
            sleep 1
          done
          response=$(curl -fsS -H 'Content-Type: application/json' -d '{"model":"smollm2-135m","messages":[{"role":"user","content":"Reply BACKPACK_MACOS_OK"}]}' http://127.0.0.1:11435/v1/chat/completions)
          printf '%s\n' "$response" | grep -q 'choices'
          session=$(backpack ps | awk 'NR == 2 {print $1; exit}')
          test -n "$session"
          backpack ps | grep -q "$session"
          backpack stop "$session"
          backpack ps | grep -q 'No active sessions.'

  windows-codex-real-model:
    if: ${{ inputs.run_codex }}
    runs-on: [self-hosted, Windows, X64, backpack-qualification]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ inputs.release_tag }}'}
      - name: Install immutable release and run Codex edit/test gate
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CODING_MODEL: ${{ inputs.coding_model }}
          BACKPACK_HOME: ${{ runner.temp }}\backpack-qualification
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\install.ps1 -Version $env:RELEASE_TAG
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\Backpack\bin\backpack.exe'
          & $bin run doctor codex --model $env:CODING_MODEL --json
          $workspace = Join-Path $env:RUNNER_TEMP 'backpack-agent-workspace'
          New-Item -ItemType Directory -Force $workspace | Out-Null
          Set-Location $workspace
          git init
          & $bin run codex --model $env:CODING_MODEL -- exec --skip-git-repo-check 'Create hello.txt containing exactly BACKPACK_CODEX_OK, read it back, and report success.'
          if ((Get-Content -Raw .\hello.txt).Trim() -ne 'BACKPACK_CODEX_OK') { throw 'Codex real-model artifact mismatch' }
          & $bin ps

  ssh-real-host:
    if: ${{ inputs.run_ssh }}
    runs-on: [self-hosted, Linux, X64, backpack-qualification]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: '${{ inputs.release_tag }}'}
      - name: Validate required SSH qualification secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.BACKPACK_SSH_HOST }}
          SSH_USER: ${{ secrets.BACKPACK_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKPACK_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.BACKPACK_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KNOWN_HOSTS" && test -n "$SSH_PRIVATE_KEY"
      - name: Install immutable release and qualify SSH lifecycle
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BACKPACK_HOME: ${{ runner.temp }}/backpack-qualification
          SSH_HOST: ${{ secrets.BACKPACK_SSH_HOST }}
          SSH_USER: ${{ secrets.BACKPACK_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKPACK_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.BACKPACK_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/backpack_ssh_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/backpack_ssh_key"
          sh scripts/install.sh "$RELEASE_TAG"
          export PATH="$HOME/.local/bin:$PATH"
          backpack compute add ssh qualification --host "$SSH_HOST" --user "$SSH_USER" --identity-file "$RUNNER_TEMP/backpack_ssh_key"
          backpack compute doctor qualification
          backpack pull smollm2-135m
          backpack serve --address 127.0.0.1:11435 >"$RUNNER_TEMP/backpack-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11435/api/backpack/v1/health >/dev/null && break
            sleep 1
          done
          curl -fsS -H 'Content-Type: application/json' -d '{"model":"smollm2-135m","compute":"qualification","options":{"gpu_layers":"auto"}}' http://127.0.0.1:11435/api/backpack/v1/sessions >/dev/null
          first=$(curl -fsS -H 'Content-Type: application/json' -d '{"model":"smollm2-135m","messages":[{"role":"user","content":"Reply BACKPACK_SSH_OK"}]}' http://127.0.0.1:11435/v1/chat/completions)
          printf '%s\n' "$first" | grep -q 'BACKPACK_SSH_OK'
          second=$(curl -fsS -H 'Content-Type: application/json' -d '{"model":"smollm2-135m","messages":[{"role":"user","content":"Reply BACKPACK_SSH_CACHE_OK"}]}' http://127.0.0.1:11435/v1/chat/completions)
          printf '%s\n' "$second" | grep -q 'BACKPACK_SSH_CACHE_OK'
          backpack ps
